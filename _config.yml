title: Remote Excellence
description: >-
  Build distributed teams that thrive. A practical guide covering trust,
  communication, tools, and scaling for remote-first organizations.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://remote-excellence.guide" # the base hostname & protocol for your site, e.g. http://example.com

# Author information
author:
  name: Luc B. Perussault-Diallo
  twitter: lucdiallo
  linkedin: luc-b-perussault-diallo-99525519

# Social/SEO
twitter_username: lucdiallo
github_username: luuuc
locale: en_US
theme_color: "#1a1a2e"

# Open Graph defaults
og_image: /assets/images/remote-excellence-og.png

collections:
  chapters:
    output: true
    sort_by: order
  chapters_v1:
    output: true
    permalink: /v1/:path/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Include dot-directories (for .well-known)
include:
  - .well-known

# The repository, used for the release download links below.
repository: luuuc/remote-excellence-book

# The two editions, published by .github/workflows/book.yml on the release that
# carries book.version. "latest" always follows the most recent one, so these
# two addresses never need updating.
downloads:
  pdf: "https://github.com/luuuc/remote-excellence-book/releases/latest/download/remote-excellence.pdf"
  epub: "https://github.com/luuuc/remote-excellence-book/releases/latest/download/remote-excellence.epub"
  # Amazon offers no API for putting a file on someone's device. This is its
  # own upload tool, where the reader drops the EPUB they just downloaded.
  kindle: "https://www.amazon.com/sendtokindle"

# Book metadata for AI parsing
book:
  published: "2025-05-15"
  modified: "2026-01-30"
  version: "2.0"
  license: "https://creativecommons.org/licenses/by-sa/4.0/"
  language: "en-US"
